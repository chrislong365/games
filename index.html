<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games by Chris Long</title>
  <meta name="description" content="Browser games by Chris Long. Free to play, no install.">
  <style>
    :root {
      --bg: #07051a;
      --panel: #120c33;
      --edge: #2c2066;
      --text: #ece8ff;
      --muted: #a79bd6;
      --pink: #ff5fd2;
      --cyan: #4ff0ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% -10%, rgba(255, 95, 210, 0.22), transparent 60%),
        linear-gradient(180deg, var(--bg), #0b0626 60%, #150a33);
      color: var(--text);
      font: 16px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    header { text-align: center; padding: 56px 16px 24px; }
    h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 52px);
      letter-spacing: 0.08em;
      color: var(--pink);
      text-shadow: 0 0 18px rgba(255, 95, 210, 0.6);
    }
    header p { margin: 8px 0 0; color: var(--cyan); letter-spacing: 0.2em; font-size: 13px; text-transform: uppercase; }
    main {
      max-width: 1040px;
      margin: 0 auto;
      padding: 16px 16px 64px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 400px));
      justify-content: center;
      gap: 24px;
    }
    .card {
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--edge);
      border-radius: 10px;
      overflow: hidden;
      color: inherit;
      text-decoration: none;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-3px);
      border-color: var(--pink);
      box-shadow: 0 0 24px rgba(255, 95, 210, 0.35);
      outline: none;
    }
    .card img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; background: #000; }
    .body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .card h2 { margin: 0; font-size: 20px; color: var(--cyan); }
    .card p { margin: 0; color: var(--muted); font-size: 14px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
    .tags li { font-size: 11px; padding: 2px 8px; border: 1px solid var(--edge); border-radius: 99px; color: var(--muted); }
    .play {
      margin-top: auto;
      align-self: flex-start;
      padding: 6px 16px;
      border: 1px solid var(--pink);
      border-radius: 6px;
      color: var(--pink);
      font-weight: bold;
      letter-spacing: 0.15em;
      font-size: 13px;
    }
    footer { text-align: center; color: var(--muted); font-size: 12px; padding: 0 16px 32px; }
  </style>
</head>
<body>
  <header>
    <h1>GAMES</h1>
    <p>by Chris Long · play in your browser</p>
  </header>
  <main id="games">
    <noscript>
      <a class="card" href="human-factor/"><div class="body"><h2>The Human Factor</h2><span class="play">PLAY</span></div></a>
    </noscript>
  </main>
  <footer>Free to play, no install. Works best in a desktop browser; touch controls are available.</footer>
  <script>
    // The list of games lives in games.json: add an entry there to put a new game on this page.
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    fetch("games.json", { cache: "no-cache" })
      .then((r) => r.json())
      .then((games) => {
        document.getElementById("games").innerHTML = games.map((g) => `
          <a class="card" href="${esc(g.path)}">
            <img src="${esc(g.thumb)}" alt="" loading="lazy" width="640" height="360">
            <div class="body">
              <h2>${esc(g.title)}</h2>
              <p>${esc(g.blurb)}</p>
              <ul class="tags">${(g.tags || []).map((t) => `<li>${esc(t)}</li>`).join("")}</ul>
              <span class="play">PLAY ▸</span>
            </div>
          </a>`).join("");
      })
      .catch(() => {});
  </script>
</body>
</html>
